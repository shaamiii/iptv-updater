name: Update IPTV Playlist Daily

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run Scraper
        run: python scraper.py
        continue-on-error: true  # Don't fail the job if scraper fails

      - name: Upload Debug Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug.html
            debug_after_click.html
            debug_screenshot.png
            debug_screenshot_after.png
            playlist.m3u

      - name: Commit and Push (only if playlist exists)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f playlist.m3u ]; then
            git add playlist.m3u
            git commit -m "Auto-update IPTV playlist $(date)" || echo "No changes"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main || echo "Push failed"
          else
            echo "playlist.m3u not found - skipping commit"
            exit 0
          fi
